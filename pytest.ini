[pytest]
# Os testes se chamam `teste_*.py` (português, como o resto do repo), e o padrão
# do pytest é `test_*.py`. Sem esta linha, `pytest` roda ZERO testes e sai com
# codigo 0 — a suite parece verde sem ter executado nada. Só funcionava quando
# se passava o caminho do arquivo na mão.
python_files = teste_*.py test_*.py
python_functions = test_*
testpaths = testes
addopts = -q
