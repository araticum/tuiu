<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/tuiu-cartorio.css">
<title>Tuiú · Andamento (eventos)</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --novo:#4da3ff; --mud:#e8b93c; --inc:#2fbf71; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:28px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  h1 { font-size:22px; } h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  a { color:var(--acento); text-decoration:none; }
  .sec { margin:18px 0 8px; font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); }
  .item { background:var(--card); border:1px solid var(--linha); border-radius:10px;
          padding:10px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
  .tag { flex:0 0 92px; font-size:11px; font-weight:600; text-transform:uppercase; margin-top:2px; }
  .novo{color:var(--novo)} .mudanca{color:var(--mud)} .incremento{color:var(--inc)}
  .desc b.ente { color:var(--acento); font-weight:600; }
  .trans { font-family:ui-monospace, Consolas, monospace; font-size:12.5px; color:var(--dim); }
  .quando { color:var(--dim); font-size:12px; }
  .bolha { background:#0f2419; border:1px solid #1d4a32; border-radius:12px 12px 12px 3px;
           padding:9px 13px; margin-bottom:9px; white-space:pre-wrap; font-size:13px; max-width:640px; }
  .bolha .meta { color:var(--dim); font-size:11px; margin-top:5px; }
  .vazio { color:var(--dim); padding:18px 0; }
  .canais { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chip { background:var(--card); border:1px solid var(--linha); border-radius:999px; padding:3px 11px; font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Andamento <small>F1.5 — motor de eventos</small></h1>
</header>
<div class="canais" id="canais"></div>
<div class="sec">Mudanças detectadas (diff D-1 dos processos do ente)</div>
<div id="feed">carregando…</div>
<div class="sec">Outbox de notificações (WhatsApp-ready)</div>
<div id="outbox"></div>
<script>
const dt = s => s ? new Date(s).toLocaleString("pt-BR") : "";

fetch("/api/eventos").then(r=>r.json()).then(({disponivel, eventos, erro})=>{
  const el = document.getElementById("feed");
  if(!disponivel){ el.innerHTML = `<div class="vazio">indisponível: ${erro}</div>`; return; }
  if(!eventos.length){ el.innerHTML = `<div class="vazio">Nenhuma mudança desde o baseline. A cada carga diária (~09h), transições de situação, novos empenhos/OPs e relatórios aparecem aqui e viram notificação.</div>`; return; }
  el.innerHTML = "";
  for(const e of eventos){
    const trans = e.tipo==="mudanca" ? `${e.de} → ${e.para}`
                : e.tipo==="novo" ? `situação: ${e.para}` : `${e.de} → ${e.para}`;
    el.insertAdjacentHTML("beforeend", `
      <div class="item"><span class="tag ${e.tipo}">${e.tipo}</span>
        <span class="desc"><b class="ente">${e.ente}</b> — ${e.rotulo}
          <span class="trans">${trans}</span>
          <div class="quando">${e.snapshot} · ${e.dominio}</div>
        </span></div>`);
  }
});

fetch("/api/entregas").then(r=>r.json()).then(({disponivel, entregas})=>{
  const cont = {}; (entregas||[]).forEach(e=>cont[e.canal]=(cont[e.canal]||0)+1);
  document.getElementById("canais").innerHTML =
    ["outbox","webhook","whatsapp"].map(c=>`<span class="chip">${c}: ${cont[c]||0}</span>`).join("");
  const el = document.getElementById("outbox");
  const obx = (entregas||[]).filter(e=>e.canal==="outbox").slice(0,10);
  if(!obx.length){ el.innerHTML = `<div class="vazio">Sem notificações ainda.</div>`; return; }
  for(const e of obx)
    el.insertAdjacentHTML("beforeend",
      `<div class="bolha">${e.mensagem}<div class="meta">#${e.id} · ${e.status}${e.enviado_em?" "+dt(e.enviado_em):""}</div></div>`);
});
</script>
<script src="/nav.js" defer></script>
</body>
</html>
