<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuiú · Agenda de prazos</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --ok:#2fbf71; --at:#e8b93c; --ruim:#e35d5d; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:28px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  h1 { font-size:22px; } h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  a { color:var(--acento); text-decoration:none; }
  .sec { margin:20px 0 8px; font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); }
  .item { background:var(--card); border:1px solid var(--linha); border-radius:10px;
          padding:10px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:flex-start; }
  .dot { flex:0 0 10px; width:10px; height:10px; border-radius:50%; margin-top:5px; }
  .vencido,.acao_imediata { background:var(--ruim); } .atencao { background:var(--at); } .ok { background:var(--ok); }
  .quando { flex:0 0 110px; font-family:ui-monospace, Consolas, monospace; font-size:12.5px; color:var(--dim); margin-top:1px; }
  .quando b { color:var(--tx); display:block; font-size:13px; }
  .desc b.ente { color:var(--acento); font-weight:600; }
  .base { display:block; color:var(--dim); font-size:12px; margin-top:3px; }
  .bolha { background:#0f2b1c; border:1px solid #1d4a32; border-radius:12px 12px 12px 3px;
           padding:10px 14px; margin-bottom:10px; white-space:pre-wrap; font-size:13px; max-width:720px; }
  .bolha .meta { color:var(--dim); font-size:11px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1>Tuiú · Agenda de prazos <small>F1 — motor de regras</small></h1>
  <a href="/">← Carteira</a>
</header>
<div id="agenda">carregando…</div>
<div class="sec">Outbox de alertas (prontos p/ WhatsApp — fio Seriema na sequência)</div>
<div id="outbox"></div>
<script>
const dbr = s => s ? s.split("-").reverse().join("/") : "—";
const hoje = new Date(); hoje.setHours(0,0,0,0);

fetch("/api/marcos").then(r=>r.json()).then(({disponivel, marcos, erro})=>{
  const el = document.getElementById("agenda");
  if(!disponivel){ el.textContent = "agenda indisponível: " + erro; return; }
  el.innerHTML = "";
  const grupos = [["acao_imediata","🔴 Ação imediata"],["vencido","🔴 Vencidos"],
                  ["atencao","🟡 Próximos 90 dias"],["ok","🟢 No horizonte"]];
  for (const [farol, titulo] of grupos){
    const itens = marcos.filter(m=>m.farol===farol);
    if(!itens.length) continue;
    el.insertAdjacentHTML("beforeend", `<div class="sec">${titulo} · ${itens.length}</div>`);
    for (const m of itens.slice(0, farol==="ok" ? 15 : 100)){
      const dias = m.data_limite ? Math.round((new Date(m.data_limite)-hoje)/86400000) : null;
      el.insertAdjacentHTML("beforeend", `
        <div class="item"><span class="dot ${m.farol}"></span>
          <span class="quando"><b>${m.data_limite?dbr(m.data_limite):"AGORA"}</b>${dias===null?"":(dias<0?`${-dias}d atrás`:`${dias}d`)}</span>
          <span class="desc"><b class="ente">${m.ente}</b> — ${m.descricao}
            <span class="base">${m.base_legal} · fonte: ${m.fonte}${m.instrumento?` · ${m.instrumento}`:""}</span>
          </span>
        </div>`);
    }
    if(farol==="ok" && itens.length>15)
      el.insertAdjacentHTML("beforeend", `<div class="sec" style="text-transform:none">… +${itens.length-15} no horizonte</div>`);
  }
});

fetch("/api/alertas").then(r=>r.json()).then(({disponivel, alertas})=>{
  const el = document.getElementById("outbox");
  if(!disponivel){ el.textContent = "outbox indisponível"; return; }
  for (const a of alertas.slice(0,12))
    el.insertAdjacentHTML("beforeend",
      `<div class="bolha">${a.mensagem}<div class="meta">#${a.id} · gatilho ${a.gatilho} · ${a.enviado_em?"enviado":"aguardando envio"}</div></div>`);
});
</script>
</body>
</html>
