<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/tuiu-cartorio.css">
<title>Tuiú · Prestação de contas</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --ok:#2fbf71; --at:#e8b93c; --ruim:#e35d5d; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:26px; }
  a { color:var(--acento); text-decoration:none; }
  header { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  h1 { font-size:22px; } h1 small{ color:var(--dim); font-weight:400; font-size:13px; margin-left:8px }
  select, button { background:var(--card); color:var(--tx); border:1px solid var(--linha);
                   border-radius:8px; padding:6px 11px; font-size:13px; }
  .sec { font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); margin:20px 0 9px; }
  .inst { background:var(--card); border:1px solid var(--linha); border-radius:11px; padding:12px 15px; margin-bottom:10px; }
  .inst h3 { font-size:14px; margin-bottom:3px; }
  .tag { display:inline-block; border:1px solid var(--linha); border-radius:999px; padding:1px 9px;
         font-size:11.5px; color:var(--dim); margin-left:6px; }
  .completo_pc33{ color:var(--at); border-color:#5a4a2b } .simplificado_pc28{ color:var(--ok); border-color:#2b5a3a }
  .legado_pi424{ color:var(--dim) }
  .meta { color:var(--dim); font-size:12px; margin-bottom:7px; }
  ul { list-style:none; margin-top:4px; } li { padding:2px 0; font-size:13px; }
  li .base { color:var(--dim); font-size:11.5px; display:block; margin-left:20px; }
  pre { background:var(--card); border:1px solid var(--linha); border-radius:11px; padding:14px;
        white-space:pre-wrap; font-size:12.5px; max-height:520px; overflow:auto; }
  .alerta { color:var(--ruim); font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>Prestação de contas <small>checklist por regime + relatório Pix</small></h1>
  <select id="ente"></select>
</header>

<div class="sec">Relatório de Gestão — transferências especiais (Pix)</div>
<div id="pix">carregando…</div>

<div class="sec">Checklist por instrumento ativo</div>
<div id="checklist"></div>

<script>
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const REGIME = {completo_pc33:"regime completo", simplificado_pc28:"regime simplificado", legado_pi424:"regime legado"};

fetch("/api/cockpit").then(r=>r.json()).then(c=>{
  const sel=document.getElementById("ente");
  sel.innerHTML=(c.entes||[]).map(e=>`<option value="${e.cnpj}">${e.rotulo}</option>`).join("");
  sel.onchange=()=>carregar(sel.value);
  if(sel.value) carregar(sel.value);
});

function carregar(cnpj){
  fetch(`/api/relatorio-gestao-pix/${cnpj}`).then(r=>r.json()).then(d=>{
    const el=document.getElementById("pix");
    if(!d.pendentes){ el.innerHTML=`<div class="inst">Nenhum plano 2020–2024 sem relatório de gestão. ✓</div>`; return; }
    el.innerHTML = `<div class="inst">
      <h3><span class="alerta">${d.pendentes} plano(s) sem Relatório de Gestão</span></h3>
      <div class="meta">Prazo do ciclo: <b>${d.prazo_ciclo||"—"}</b> · ${d.base_legal||""}<br>
        Risco: ${d.risco}<br>${d.regra_capital}</div>
      <a href="/api/relatorio-gestao-pix/${cnpj}?formato=md" target="_blank">▸ abrir rascunho completo (markdown, colável)</a>
    </div>` + d.rascunhos.slice(0,6).map(r=>`
      <div class="inst"><h3>Plano ${r.plano} <span class="tag">${r.ano}</span> <span class="tag">${r.situacao}</span></h3>
        <div class="meta">${r.objeto? r.objeto.slice(0,110)+" · ":""}${r.parlamentar?("emenda "+(r.emenda||"")+" · "+r.parlamentar):""}</div>
        <div class="meta">Total ${brl(r.valor_total)} · capital ${r.percentual_capital ?? "—"}%
          ${r.alerta_capital?'<span class="alerta">ABAIXO DO MÍNIMO (art. 166-A §5º)</span>':""}</div>
      </div>`).join("");
  });

  fetch(`/api/prestacao/${cnpj}`).then(r=>r.json()).then(d=>{
    const el=document.getElementById("checklist");
    const ins=d.instrumentos||[];
    if(!ins.length){ el.innerHTML=`<div class="inst">${d.nota||"sem instrumentos ativos"}</div>`; return; }
    el.innerHTML = ins.map(i=>`
      <div class="inst">
        <h3>${i.nr_convenio} <span class="tag ${i.regime}">${REGIME[i.regime]||i.regime}</span>
            <span class="tag">${i.situacao||""}</span></h3>
        <div class="meta">assinado ${i.assinatura||"—"} · vigência até ${i.fim_vigencia||"—"} ·
          limite da prestação <b>${i.limite_prestacao||"—"}</b>
          ${i.prazo_apresentacao?`(${i.prazo_apresentacao} dias — ${i.prazo_base_legal||""})`:""}</div>
        <ul>${i.checklist.map(c=>`<li>☐ ${c.item}${c.base_legal?`<span class="base">${c.base_legal}</span>`:""}</li>`).join("")}</ul>
      </div>`).join("");
  });
}
</script>
<script src="/nav.js" defer></script>
</body>
</html>
