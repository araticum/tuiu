<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/tuiu-cartorio.css">
<title>Tuiú · Notificações</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --acento:#4da3ff; --on:#2fbf71; --off:#7c8ba0; --alerta:#e8b93c; --perigo:#ff6b6b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:28px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:18px; flex-wrap:wrap; }
  h1 { font-size:22px; } h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  a { color:var(--acento); text-decoration:none; }
  .sec { margin:22px 0 8px; font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); }
  .card { background:var(--card); border:1px solid var(--linha); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .mestre { border-color:#2a3a52; }
  .linha { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .linha .txt { flex:1; min-width:260px; }
  .nome { font-weight:600; font-size:15px; }
  .desc { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .alcance { font-size:12px; margin-top:6px; }
  .interno { color:var(--on); } .cliente { color:var(--alerta); } .externo { color:var(--acento); }
  .estado { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; min-width:72px; text-align:right; }
  .estado.on { color:var(--on); } .estado.off { color:var(--off); }
  button.sw { background:#1b2534; color:var(--tx); border:1px solid var(--linha); border-radius:999px;
              padding:7px 16px; font-size:13px; cursor:pointer; min-width:104px; }
  button.sw.on { background:#14382a; border-color:#1d5c3f; color:#7ee2ab; }
  button.sw:disabled { opacity:.45; cursor:not-allowed; }
  .aviso { border-left:3px solid var(--alerta); padding:10px 14px; background:#1a1608; border-radius:6px;
           font-size:13px; margin-bottom:14px; }
  .bloq { border-left:3px solid var(--perigo); padding:8px 12px; background:#1e0f12; border-radius:6px;
          font-size:12.5px; color:#ffb3b3; margin-top:8px; }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--linha); }
  th { color:var(--dim); font-weight:500; }
  code { font-family:ui-monospace, Consolas, monospace; color:var(--dim); }
  .vazio { color:var(--dim); padding:14px 0; }
</style>
</head>
<body>
<header>
  <h1>Notificações <small>interruptor de envio externo</small></h1>
</header>

<div class="aviso">
  A carteira tem <b>organizações reais</b> que não pediram para receber nada nosso.
  Envio externo nasce desligado e só sai com a trava geral <b>e</b> a do canal ligadas.
  Cada mudança fica registrada com autor e horário.
</div>

<div id="conteudo"><div class="vazio">carregando…</div></div>

<script>
const ROTULOS = {
  seriema:  { nome: "WhatsApp da equipe", classe: "interno",
              desc: "Aviso interno de operação. Não chega ao cliente." },
  whatsapp: { nome: "WhatsApp direto ao cliente", classe: "cliente",
              desc: "Cloud API, para os números cadastrados em `destinatarios`." },
  webhook:  { nome: "Webhook", classe: "externo",
              desc: "POST JSON para um sistema externo." },
};

// Dois transportes para o canal da equipe: a Cloud API não fala com grupo, então
// lá "o grupo" é a lista de números. Quem vai ligar a chave precisa ver POR ONDE
// vai sair e PARA QUANTOS — ligar sem isso é o mesmo que ligar às cegas.
const TRANSPORTE = {
  cloud_api:        "Cloud API oficial da Meta, um por número da equipe",
  internal_session: "Sessão própria (sidecar), mensagem em grupo",
};

async function carregar() {
  const r = await fetch("/api/notificacoes");
  const d = await r.json();
  const alvo = document.getElementById("conteudo");
  if (!d.disponivel) {
    alvo.innerHTML = `<div class="card">Sem banco: <code>${d.erro || "indisponível"}</code></div>`;
    return;
  }
  const geral = d.geral_ligado;

  let html = `<div class="sec">Trava geral</div>
    <div class="card mestre"><div class="linha">
      <div class="txt">
        <div class="nome">Envio externo de notificações</div>
        <div class="desc">Desligada, nada sai da casa — os eventos continuam sendo
          registrados na outbox e visíveis em Andamento.</div>
      </div>
      <div class="estado ${geral ? "on" : "off"}">${geral ? "ligado" : "desligado"}</div>
      <button class="sw ${geral ? "on" : ""}" onclick="alternar('notificacoes_ativas', ${!geral})">
        ${geral ? "Desligar" : "Ligar"}</button>
    </div></div>`;

  html += `<div class="sec">Canais</div>`;
  for (const [id, c] of Object.entries(d.canais)) {
    const meta = ROTULOS[id] || { nome: id, classe: "externo", desc: "" };
    const impedido = c.configurado === false;
    let nota = `<div class="alcance ${meta.classe}">Alcance: ${c.alcance}</div>`;
    if (c.transporte)
      nota += `<div class="alcance">Transporte: <b>${c.transporte}</b>`
            + (TRANSPORTE[c.transporte] ? ` — ${TRANSPORTE[c.transporte]}` : "")
            + (c.destinos != null ? ` · <b>${c.destinos}</b> destino(s) na equipe` : "")
            + `</div>`;
    if (impedido) nota += `<div class="bloq">Não configurado — falta ${c.falta}. Ligar aqui não faz efeito.</div>`;
    if (id === "seriema" && c.transporte === "cloud_api" && c.destinos === 0)
      nota += `<div class="bloq">Nenhum número da equipe em TUIU_SERIEMA_CLOUD_DESTINOS: ligar não envia nada.</div>`;
    if (c.destinatarios === 0 && id !== "seriema")
      nota += `<div class="bloq">Nenhum destinatário ativo cadastrado: ligar não envia nada.</div>`;
    if (c.dry_run) nota += `<div class="bloq">DRY-RUN ativo: monta a mensagem e não envia.</div>`;
    html += `<div class="card"><div class="linha">
        <div class="txt">
          <div class="nome">${meta.nome}</div>
          <div class="desc">${meta.desc}</div>
          ${nota}
        </div>
        <div class="estado ${c.ligado ? "on" : "off"}">${c.ligado ? "ligado" : "desligado"}</div>
        <button class="sw ${c.ligado ? "on" : ""}" onclick="alternar('canal_${id}', ${!c.ligado})">
          ${c.ligado ? "Desligar" : "Ligar"}</button>
      </div></div>`;
  }

  html += `<div class="sec">Situação</div><div class="card">
      <b>${d.eventos_sem_envio_externo}</b> evento(s) registrados sem envio externo.
      ${geral ? "" : "Com a trava geral desligada, é o esperado."}
    </div>`;

  if (d.historico.length) {
    html += `<div class="sec">Quem mexeu no interruptor</div><div class="card"><table>
      <tr><th>quando</th><th>chave</th><th>de → para</th><th>quem</th></tr>` +
      d.historico.map(h => `<tr><td>${(h.quando || "").replace("T", " ").slice(0, 19)}</td>
        <td><code>${h.chave}</code></td><td>${h.de ?? "—"} → <b>${h.para}</b></td>
        <td>${h.quem || "—"}</td></tr>`).join("") + `</table></div>`;
  }
  alvo.innerHTML = html;
}

async function alternar(chave, valor) {
  // ligar alcança gente de fora; confirmar é barato perto do estrago
  if (valor && !confirm(`Ligar "${chave}"?\n\nCom a trava geral ligada, mensagens passam a sair de verdade.`))
    return;
  const r = await fetch("/api/notificacoes", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chave, valor: valor ? "true" : "false" }),
  });
  if (!r.ok) { alert("falhou: " + (await r.text())); return; }
  carregar();
}

carregar();
</script>
<script src="/nav.js" defer></script>
</body>
</html>
