<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/tema.js"></script>
<link rel="stylesheet" href="/tuiu-cartorio.css">
<title>Tuiú · Carteira (detalhe)</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --ok:#2fbf71; --at:#e8b93c; --ruim:#e35d5d; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.45 system-ui, Segoe UI, sans-serif; padding:28px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  h1 { font-size:22px; letter-spacing:.3px; }
  h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  .badge { background:var(--card); border:1px solid var(--linha); border-radius:999px;
           padding:4px 12px; font-size:12px; color:var(--dim); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(430px, 1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:16px 18px; }
  .card h2 { font-size:15px; margin-bottom:2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .sec { border-top:1px solid var(--linha); padding:9px 0 2px; }
  .sec b.t { display:block; font-size:11px; letter-spacing:.8px; text-transform:uppercase;
             color:var(--dim); margin-bottom:5px; }
  .kv { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; }
  .kv span b { color:var(--acento); font-weight:600; }
  ul.prest { list-style:none; margin-top:6px; font-size:12.5px; }
  ul.prest li { padding:2px 0; color:var(--dim); }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; }
  .vencido { background:var(--ruim); } .atencao { background:var(--at); } .ok { background:var(--ok); }
  .alerta { color:var(--ruim); font-weight:600; }
  .mono { font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  footer { margin-top:26px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Carteira <small>detalhe por ente</small></h1>
  <span class="badge" id="snapshot">carregando…</span>
</header>
<div class="grid" id="grid"></div>
<footer>Dados públicos oficiais (Transferegov g2 + CSVs detru), D-1. Tela provisória da F0 — o shell definitivo entra nas próximas fases.</footer>
<script>
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const dbr = s => s ? s.split("-").reverse().join("/") : "—";

function sit(obj){ return Object.entries(obj||{}).map(([k,v])=>`${k}: ${v}`).join(" · ") || "—"; }

fetch("/api/entes").then(r=>r.json()).then(({snapshot, entes})=>{
  document.getElementById("snapshot").textContent = snapshot
    ? `dados da API de ${dbr(snapshot)} (D-1)` : "sem recorte — rode o ingest";
  const grid = document.getElementById("grid");
  for (const e of entes){
    const p = e.parcerias||{}, esp = e.especiais||{}, em = e.emendas_indicadas||{}, lg = e.legado||{};
    const imped = (esp.impedidos||[]);
    const prest = (lg.prestacoes||[]);
    const vencidas = prest.filter(x=>x.farol==="vencido").length;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h2>${e.rotulo || e.nome}</h2>
      <div class="sub"><span class="mono">${e.cnpj}</span> · ${e.municipio||"—"}/${e.uf||"—"}</div>

      <div class="sec"><b class="t">Parcerias — ciclo novo (g2)</b>
        <div class="kv">
          <span>propostas <b>${p.propostas||0}</b></span>
          <span>instrumentos <b>${p.instrumentos||0}</b></span>
          <span>NE→DH→OP <b>${p.empenhos||0}→${p.documentos_habeis||0}→${p.ordens_pagamento||0}</b></span>
          <span>extrato <b>${p.lancamentos_extrato||0}</b></span>
          <span>saldo <b>${brl((p.saldo_conta_corrente||0)+(p.saldo_investimento||0))}</b></span>
        </div>
        <div class="sub" style="margin:6px 0 0">${sit(p.por_situacao)}</div>
      </div>

      <div class="sec"><b class="t">Emendas indicadas (a caminho)</b>
        <div class="kv"><span>indicações <b>${em.qtd||0}</b></span><span>valor <b>${brl(em.valor_total)}</b></span></div>
      </div>

      <div class="sec"><b class="t">Transferências especiais (Pix)</b>
        <div class="kv">
          <span>planos <b>${esp.planos||0}</b></span>
          <span>valor <b>${brl(esp.valor_total)}</b></span>
          <span>${imped.length ? `<span class="alerta">${imped.length} impedido(s)</span>` : "sem impedimento"}</span>
        </div>
        ${imped.slice(0,3).map(i=>`<div class="sub" style="margin-top:5px">🔴 <span class="mono">${i.codigo}</span> (${i.ano}) — ${(i.motivo||i.situacao||"").slice(0,110)}${(i.motivo||"").length>110?"…":""}</div>`).join("")}
      </div>

      <div class="sec"><b class="t">Regularidade (CEPIM · CEIS · CNEP)</b>
        <div class="kv">
          ${(e.regularidade&&e.regularidade.fontes)
            ? (e.regularidade.impedido
                ? `<span class="alerta">IMPEDIDO</span>` + Object.entries(e.regularidade.fontes).filter(([,f])=>f.registros).map(([k,f])=>`<span>${k.toUpperCase()}: <b>${f.registros}</b></span>`).join("")
                : `<span style="color:var(--ok)">sem impedimento</span>` + Object.keys(e.regularidade.fontes).map(k=>`<span>${k.toUpperCase()} ✓</span>`).join(""))
            : `<span style="color:var(--dim)">${(e.regularidade&&e.regularidade.motivo)||"não coletado"}</span>`}
        </div>
        <div class="sub" style="margin-top:4px">impedimento de celebrar/contratar do executor (não é CAUC — esse é do ente)</div>
      </div>

      <div class="sec"><b class="t">Legado SICONV (2008→)</b>
        <div class="kv">
          <span>instrumentos <b>${lg.instrumentos||0}</b></span>
          <span>ativos <b>${lg.ativos||0}</b></span>
          <span>repasse/obra ativos <b>${lg.contratos_repasse_ativos||0}</b></span>
          <span>${vencidas ? `<span class="alerta">${vencidas} prestação(ões) VENCIDA(S)</span>` : (prest.length ? "prestações em dia" : "—")}</span>
        </div>
        <ul class="prest">
          ${prest.slice(0,6).map(x=>`<li><span class="dot ${x.farol}"></span><span class="mono">${x.nr_convenio}</span> ${x.modalidade} · ${x.situacao} — limite ${dbr(x.limite_prestacao)} (${x.dias<0?`${-x.dias}d atrasada`:`${x.dias}d`})</li>`).join("")}
        </ul>
      </div>`;
    grid.appendChild(card);
  }
});
</script>
<script src="/nav.js" defer></script>
</body>
</html>
