<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuiú · Ficha do cliente</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --ok:#2fbf71; --at:#e8b93c; --ruim:#e35d5d; --acao:#ff7a59; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:24px; }
  a { color:var(--acento); text-decoration:none; }
  header { display:flex; align-items:baseline; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
  h1 { font-size:22px; } h1 small{ color:var(--dim); font-weight:400; font-size:13px; margin-left:8px }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:14px; }
  .kpis{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px }
  .kpi{ background:var(--card); border:1px solid var(--linha); border-radius:11px; padding:9px 14px; min-width:110px }
  .kpi b{ font-size:20px; display:block; line-height:1.15 } .kpi span{ color:var(--dim); font-size:11.5px }
  .kpi.acao b{color:var(--acao)} .kpi.venc b{color:var(--ruim)} .kpi.ok b{color:var(--ok)} .kpi.ruim b{color:var(--ruim)}
  .grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:18px; align-items:start }
  @media (max-width:1000px){ .grid{grid-template-columns:1fr} }
  .sec{ font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); margin:4px 0 9px }
  .box{ background:var(--card); border:1px solid var(--linha); border-radius:11px; padding:12px 15px; margin-bottom:10px }
  .li{ padding:5px 0; border-bottom:1px solid var(--linha); font-size:13px } .li:last-child{border:0}
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px }
  .acao_imediata{background:var(--acao)} .vencido{background:var(--ruim)} .atencao{background:var(--at)} .ok{background:var(--ok)}
  .meta{ color:var(--dim); font-size:11.5px; margin-left:15px }
  textarea, input, select { background:#0d141d; color:var(--tx); border:1px solid var(--linha);
                            border-radius:8px; padding:7px 9px; font:13px system-ui; width:100% }
  button{ background:var(--card); color:var(--tx); border:1px solid var(--linha); border-radius:8px;
          padding:6px 13px; font-size:13px; cursor:pointer; margin-top:7px } button:hover{border-color:var(--acento)}
  .linha2{ display:flex; gap:7px } .linha2 input{ flex:1 }
  .impedido{ color:var(--ruim); font-weight:600 } .limpo{ color:var(--ok) }
</style>
</head>
<body>
<header>
  <h1 id="nome">carregando…</h1>
  <a href="/fila.html">⚡ Fila</a> <a href="/">Cockpit</a>
</header>
<div class="sub" id="sub"></div>
<div class="kpis" id="kpis"></div>

<div class="grid">
  <div>
    <div class="sec">Prazos abertos</div>
    <div class="box" id="prazos"></div>

    <div class="sec">Andamento recente</div>
    <div class="box" id="andamento"></div>
  </div>

  <div>
    <div class="sec">Regularidade (entidade e dirigentes)</div>
    <div class="box" id="regularidade"></div>

    <div class="sec">Dirigentes</div>
    <div class="box" id="pessoas"></div>

    <div class="sec">Diário de atendimento</div>
    <div class="box">
      <select id="tipoNota">
        <option value="contato">contato</option><option value="nota">nota</option>
        <option value="protocolo">protocolo</option><option value="documento">documento</option>
        <option value="decisao">decisão</option>
      </select>
      <textarea id="texto" rows="2" placeholder="o que aconteceu / o que combinamos" style="margin-top:6px"></textarea>
      <button onclick="anotar()">registrar</button>
      <div id="diario" style="margin-top:10px"></div>
    </div>
  </div>
</div>

<script>
const doc = new URLSearchParams(location.search).get("doc") || "20069629000103";
const dbr = s => s ? s.split("-").reverse().join("/") : "sem data";
const dth = s => s ? new Date(s).toLocaleString("pt-BR") : "";

function carregar(){
  fetch(`/api/cliente/${doc}`).then(r=>r.json()).then(f=>{
    if(!f.disponivel){ document.getElementById("nome").textContent = "erro: "+f.erro; return; }
    const c=f.cadastro, r=f.resumo, cart=f.carteira||{};
    document.getElementById("nome").innerHTML = `${c.apelido||c.nome} <small>ficha do cliente</small>`;
    document.getElementById("sub").textContent =
      `${c.nome} · ${doc} · ${cart.municipio||"—"}/${cart.uf||"—"}${c.operador?" · operador "+c.operador:""}`;

    document.getElementById("kpis").innerHTML = [
      ["acao", r.acao_imediata, "ação imediata"],
      ["venc", r.vencidos, "vencidos"],
      ["", r.propostas, "propostas (g2)"],
      ["", r.instrumentos_legado_ativos, "instrum. legado"],
      [r.impedido?"ruim":"ok", r.impedido?"SIM":"não", "impedido"],
      ["", r.dirigentes, "dirigentes"],
    ].map(([cls,n,l])=>`<div class="kpi ${cls}"><b>${n}</b><span>${l}</span></div>`).join("");

    document.getElementById("prazos").innerHTML = (f.prazos||[]).slice(0,14).map(p=>`
      <div class="li"><span class="dot ${p.farol}"></span>${p.descricao}
        <div class="meta">${dbr(p.data_limite)}${p.dias!=null?` · ${p.dias<0?-p.dias+"d atrás":"em "+p.dias+"d"}`:""} · ${p.base_legal||""}</div>
      </div>`).join("") || `<div class="meta">nenhum prazo aberto</div>`;

    document.getElementById("andamento").innerHTML = (f.andamento||[]).slice(0,10).map(a=>`
      <div class="li">${a.origem==="inbox"?"📩":"🔔"} ${a.rotulo}
        <div class="meta">${a.de?`${a.de} → ${a.para}`:(a.para||"")} · ${a.snapshot}</div></div>`).join("")
      || `<div class="meta">sem mudanças registradas</div>`;

    const reg=f.regularidade||{};
    let rh = reg.fontes
      ? `<div class="li">${reg.impedido?'<span class="impedido">IMPEDIDO</span>':'<span class="limpo">sem impedimento</span>'}
           <div class="meta">${Object.entries(reg.fontes).map(([k,v])=>`${k.toUpperCase()}: ${v.registros}`).join(" · ")}</div></div>`
      : `<div class="meta">${reg.motivo||"não coletado"}</div>`;
    (reg.dirigentes||[]).forEach(d=>{
      rh += `<div class="li">${d.impedido?'<span class="impedido">⚠ '+d.nome+'</span>':d.nome}
        <div class="meta">${d.papel||"—"} · ${Object.entries(d.fontes||{}).map(([k,v])=>k.toUpperCase()+":"+v).join(" ")}</div></div>`;
    });
    if((reg.avisos||[]).length) rh += `<div class="meta" style="margin-top:6px">${reg.avisos.join("<br>")}</div>`;
    document.getElementById("regularidade").innerHTML = rh;

    document.getElementById("pessoas").innerHTML =
      (c.pessoas||[]).map(p=>`<div class="li">${p.nome}<div class="meta">${p.papel||"—"} · CPF ${p.cpf.slice(0,3)}.***.***-${p.cpf.slice(-2)}</div></div>`).join("")
      + `<div class="linha2" style="margin-top:8px">
           <input id="pNome" placeholder="nome do dirigente"><input id="pCpf" placeholder="CPF">
           <input id="pPapel" placeholder="papel" style="max-width:110px"></div>
         <button onclick="addPessoa()">cadastrar dirigente</button>`;

    document.getElementById("diario").innerHTML = (f.diario||[]).map(d=>`
      <div class="li"><b>${d.tipo}</b> — ${d.texto}
        <div class="meta">${dth(d.quando)}${d.autor?" · "+d.autor:""}</div></div>`).join("")
      || `<div class="meta">sem registros</div>`;
  });
}

function anotar(){
  const texto=document.getElementById("texto").value.trim();
  if(!texto) return;
  fetch(`/api/cliente/${doc}/diario`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({texto, tipo:document.getElementById("tipoNota").value, autor:"araticum"})})
    .then(()=>{ document.getElementById("texto").value=""; carregar(); });
}
function addPessoa(){
  const nome=document.getElementById("pNome").value.trim(), cpf=document.getElementById("pCpf").value.trim();
  if(!nome||!cpf) return;
  fetch(`/api/cliente/${doc}/pessoa`, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({nome, cpf, papel:document.getElementById("pPapel").value.trim()})})
    .then(r=>r.json()).then(x=>{ if(!x.ok) alert(x.erro); carregar(); });
}
carregar();
</script>
</body>
</html>
