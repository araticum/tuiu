<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuiú · Entrar</title>
<style>
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:#E8DECB; }
  *{ box-sizing:border-box; }
  ::selection{ background:rgba(166,74,42,.25); }
  #palco{ position:fixed; inset:0; display:block; width:100%; height:100%; cursor:none; touch-action:none; z-index:0; }
  #readout{ position:fixed; top:24px; right:26px; z-index:3; text-align:right; pointer-events:none;
    font-family:'Courier New',ui-monospace,monospace; font-size:9px; letter-spacing:2.5px; line-height:1.9;
    color:#5A4C3E; background:rgba(232,222,203,.62); padding:6px 10px; display:flex; flex-direction:column; align-items:flex-end; }
  #dica{ position:fixed; bottom:26px; left:26px; z-index:3; pointer-events:none; white-space:nowrap;
    font-family:'Courier New',ui-monospace,monospace; font-size:10px; letter-spacing:3.5px; color:#211A15;
    padding:7px 14px; border:1px solid rgba(33,26,21,.35); background:rgba(232,222,203,.55);
    transition:opacity .9s ease; opacity:.85; }
  #card{ position:fixed; z-index:4; left:60%; top:64%; transform:translate(-50%,-50%); }
  #f{ width:min(88vw,396px); background:#F2EAD9; border:1px solid #211A15; box-shadow:9px 9px 0 rgba(33,26,21,.16);
    padding:44px 40px 34px; display:flex; flex-direction:column; }
  #f h1{ margin:0; font-family:Georgia,'Times New Roman','Noto Serif',serif; font-weight:400; font-style:italic;
    font-size:58px; line-height:1; color:#211A15; letter-spacing:.5px; }
  #f .sub{ margin:12px 0 0; font-family:'Courier New',ui-monospace,monospace; font-size:10.5px; letter-spacing:2.8px; color:#A64A2A; }
  #f hr{ border:none; border-top:1px solid rgba(33,26,21,.28); margin:24px 0 4px; width:100%; }
  #f label{ display:block; margin-top:24px; font-family:'Courier New',ui-monospace,monospace; font-size:10.5px;
    letter-spacing:2.8px; color:#5A4C3E; text-transform:uppercase; }
  #f input{ display:block; width:100%; margin-top:6px; background:transparent; border:none; border-radius:0;
    border-bottom:1px solid #211A15; padding:10px 2px 9px; outline:none;
    font-family:Georgia,'Times New Roman',serif; font-size:19px; color:#211A15; }
  #f input:focus{ border-bottom-color:#A64A2A; box-shadow:0 1px 0 #A64A2A; }
  #f .erro{ min-height:19px; margin:14px 0 0; font-family:Georgia,'Times New Roman',serif; font-size:14px; font-style:italic; color:#A64A2A; }
  #f button{ margin-top:32px; width:100%; padding:17px 10px; background:#211A15; color:#E8DECB; border:none; cursor:pointer;
    font-family:'Courier New',ui-monospace,monospace; font-size:12px; letter-spacing:3.8px; text-transform:uppercase; transition:background .25s ease; }
  #f button:hover{ background:#A64A2A; }
  #f button:disabled{ cursor:default; }
  #f .nota{ margin:8px 0 0; font-family:Georgia,'Times New Roman',serif; font-size:13.5px; line-height:1.65; color:#5A4C3E; }
  #f .nota code{ font-family:'Courier New',ui-monospace,monospace; font-size:11.5px; background:rgba(33,26,21,.07);
    padding:2px 5px; color:#211A15; display:inline-block; margin-top:4px; }
  @media (prefers-reduced-motion: reduce){ #dica{ display:none; } #palco{ cursor:default; } }
</style>
</head>
<body>
<canvas id="palco"></canvas>

<div id="readout">
  <span>01 — PANTANAL</span>
  <span>TUIUIÚ · JABIRU MYCTERIA</span>
  <span id="pesca" style="color:#A64A2A;display:none"></span>
</div>

<div id="dica">CLIQUE NUMA PALAVRA</div>

<main id="card">
  <form id="f" onsubmit="entrar(event)">
    <h1>Tuiú</h1>
    <p class="sub">CONSOLE DE OPERAÇÃO · TRANSFEREGOV</p>
    <hr>
    <label for="login">Usuário</label>
    <input id="login" name="login" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <p class="erro" id="erro" role="alert" aria-live="polite"></p>
    <button id="b" type="submit">Entrar</button>
    <p class="nota" id="nota" style="display:none"></p>
  </form>
</main>

<script>
/* ---------- autenticação (contrato do Tuiú) ---------- */
fetch("/api/sessao").then(function (r) { return r.json(); }).then(function (d) {
  if (d.autenticado) { location.href = "/"; return; }
  if (!d.ha_usuario) {
    var n = document.getElementById("nota"); n.style.display = "block";
    n.innerHTML = 'Nenhum usuário cadastrado ainda. No host:<br><code>python ferramentas/usuario.py --criar &lt;login&gt; --nome "Seu Nome"</code>';
  }
}).catch(function () {});

async function entrar(ev) {
  ev.preventDefault();
  var b = document.getElementById("b"), erro = document.getElementById("erro");
  b.disabled = true; erro.textContent = "";
  try {
    var r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login: document.getElementById("login").value, senha: document.getElementById("senha").value })
    });
    if (r.ok) { location.href = "/"; return; }
    var d = await r.json().catch(function () { return {}; });
    erro.textContent = d.detail || "não foi possível entrar";
  } catch (e) {
    erro.textContent = "falha de rede";
  } finally {
    b.disabled = false;
    document.getElementById("senha").value = "";
  }
}

/* foco imperativo no usuário (autofocus é inerte em montagem tardia) */
(function () {
  var foco = setInterval(function () {
    var el = document.getElementById("login");
    if (el && !(document.activeElement instanceof HTMLInputElement)) el.focus();
    if (el && document.activeElement === el) clearInterval(foco);
  }, 100);
  setTimeout(function () { clearInterval(foco); }, 5000);
})();

/* ============================================================
   Cena: lago pantaneiro ao entardecer. Um tuiuiú vadeia a água
   rasa; as palavras do domínio nadam como peixes translúcidos.
   Clicar numa palavra manda a ave caminhar (ou voar) até ela,
   dar o bote e tirá-la do lago.
   Motor portado do handoff de design (geometria paramétrica).
   ============================================================ */
(function cena() {
  var PROPS = { escalaAve: null, nadadores: null, horizonte: null, modoDeslocamento: "auto" };
  var pescadas = 0, ultima = "";
  function readout() {
    var p = document.getElementById("pesca"); if (!p) return;
    p.style.display = "block";
    p.textContent = "PESCADAS " + String(pescadas).padStart(2, "0") + " · " + ultima;
  }

  var cv = document.getElementById("palco"); if (!cv) return;
  var ctx = cv.getContext("2d");
  var TAU = Math.PI * 2;
  var REDUZ = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  var PALAVRAS = ["PRAZO","CAUC","EMENDA PIX","CONVÊNIO","PRESTAÇÃO","TRANSFEREGOV","D-1","CERTIDÃO",
    "DILIGÊNCIA","PROTOCOLO","CARTEIRA","VIGIA DOU","PORTARIA","COMPLEMENTAÇÃO"];
  var TINTA_PEIXE = "#2E3A36", RAIO_FUGA = 150, BICO = 0.80;

  var W = 0, H = 0, DPR = 1, MOVEL = false, HOR = 0;
  var CARD = { l: 0, r: 0, t: 0, b: 0 }, ZY0 = 0, ZY1 = 0;
  var fundo = null, sprites = {}, peixes = [], aneis = [], gotas = [];
  var ponteiro = { x: -9999, y: -9999, dentro: false }, sobre = null;
  var raf = 0, ultimo = 0, proxNascer = 0, nAlvo = 15;

  var ave = {
    x: 0, y: 0, s: 60, virado: 1, estado: "parado", tEst: 0,
    cab: { x: 0.60, y: -3.12 }, cabA: { x: 0.60, y: -3.12 }, ang: 0.5, angA: 0.5,
    passo: 0, spread: 0, flap: 0, pitch: 0, alvo: null, presa: null,
    bulge: -1, voo: null, espera: 0, caca: 0, pousoSplash: false
  };
  var REST = { x: 0.60, y: -3.12 };

  function lerp(a, b, k) { return a + (b - a) * k; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function mola(atual, alvo, k, dt) { return atual + (alvo - atual) * Math.min(1, k * dt); }

  function traco(g, p, fechada) {
    var n = p.length; if (n < 2) return;
    g.beginPath(); g.moveTo(p[0].x, p[0].y);
    var lim = fechada ? n : n - 1;
    for (var i = 0; i < lim; i++) {
      var p0 = fechada ? p[(i - 1 + n) % n] : p[Math.max(i - 1, 0)];
      var p1 = p[i % n], p2 = p[(i + 1) % n];
      var p3 = fechada ? p[(i + 2) % n] : p[Math.min(i + 2, n - 1)];
      g.bezierCurveTo(p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
                      p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6, p2.x, p2.y);
    }
    if (fechada) g.closePath();
  }

  function fita(espinha, wfn) {
    var a = [], b = [], n = espinha.length;
    for (var i = 0; i < n; i++) {
      var p0 = espinha[Math.max(i - 1, 0)], p1 = espinha[Math.min(i + 1, n - 1)];
      var tx = p1.x - p0.x, ty = p1.y - p0.y, l = Math.hypot(tx, ty) || 1;
      var nx = -ty / l, ny = tx / l, w = wfn(i / (n - 1)) / 2;
      a.push({ x: espinha[i].x + nx * w, y: espinha[i].y + ny * w });
      b.push({ x: espinha[i].x - nx * w, y: espinha[i].y - ny * w });
    }
    return a.concat(b.reverse());
  }

  function bez(p0, c1, c2, p1, n) {
    var out = [];
    for (var i = 0; i <= n; i++) {
      var t = i / n, u = 1 - t;
      out.push({
        x: u * u * u * p0.x + 3 * u * u * t * c1.x + 3 * u * t * t * c2.x + t * t * t * p1.x,
        y: u * u * u * p0.y + 3 * u * u * t * c1.y + 3 * u * t * t * c2.y + t * t * t * p1.y
      });
    }
    return out;
  }

  function ik(hip, pe, l1, l2) {
    var dx = pe.x - hip.x, dy = pe.y - hip.y;
    var d = Math.min(Math.hypot(dx, dy), (l1 + l2) * 0.995) || 0.001;
    var a = Math.atan2(dy, dx);
    var c = clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1);
    var ang = a + Math.acos(c);
    return { x: hip.x + Math.cos(ang) * l1, y: hip.y + Math.sin(ang) * l1 };
  }

  function criarSprites() {
    var tam = 15, esc = Math.min(DPR, 2) * 1.6;
    var fonte = '600 ' + (tam * esc) + 'px Georgia, "Times New Roman", "Noto Serif", serif';
    sprites = {};
    for (var k = 0; k < PALAVRAS.length; k++) {
      var palavra = PALAVRAS[k];
      var med = document.createElement("canvas").getContext("2d");
      med.font = fonte;
      var larg = Math.ceil(med.measureText(palavra).width);
      var c = document.createElement("canvas");
      c.width = larg + 8; c.height = Math.ceil(tam * esc * 1.6);
      var g = c.getContext("2d");
      g.font = fonte; g.fillStyle = TINTA_PEIXE; g.textBaseline = "middle";
      g.fillText(palavra, 4, c.height / 2);
      sprites[palavra] = { c: c, w: c.width / esc, h: c.height / esc, palavra: palavra };
    }
  }

  function pintarFundo() {
    fundo = document.createElement("canvas");
    fundo.width = Math.max(1, Math.round(W * DPR));
    fundo.height = Math.max(1, Math.round(H * DPR));
    var g = fundo.getContext("2d");
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.fillStyle = "#E8DECB"; g.fillRect(0, 0, W, H);

    var ceu = g.createLinearGradient(0, 0, 0, HOR);
    ceu.addColorStop(0, "#C9A079"); ceu.addColorStop(0.55, "#DCB98E"); ceu.addColorStop(1, "#EDD2A4");
    g.fillStyle = ceu; g.fillRect(0, 0, W, HOR + 1);

    var solX = W * 0.5, solY = HOR - H * 0.075, solR = H * 0.048;
    var halo = g.createRadialGradient(solX, solY, solR * 0.4, solX, solY, solR * 3.2);
    halo.addColorStop(0, "rgba(242,224,192,.5)"); halo.addColorStop(1, "rgba(242,224,192,0)");
    g.fillStyle = halo; g.fillRect(solX - solR * 3.2, solY - solR * 3.2, solR * 6.4, solR * 6.4);
    g.fillStyle = "#F2E0C0"; g.beginPath(); g.arc(solX, solY, solR, 0, TAU); g.fill();

    g.fillStyle = "rgba(74,59,44,.42)";
    g.beginPath(); g.moveTo(0, HOR);
    for (var vx = 0; vx <= W; vx += 26) {
      var bump = Math.abs(Math.sin(vx * 0.021) * 3 + Math.sin(vx * 0.007) * 5);
      g.lineTo(vx, HOR - bump - 1);
    }
    g.lineTo(W, HOR + 1); g.lineTo(0, HOR + 1); g.closePath(); g.fill();

    var agua = g.createLinearGradient(0, HOR, 0, H);
    agua.addColorStop(0, "#DFC49B"); agua.addColorStop(0.30, "#BBA87C");
    agua.addColorStop(0.70, "#96896A"); agua.addColorStop(1, "#7E7458");
    g.fillStyle = agua; g.fillRect(0, HOR, W, H - HOR);

    g.lineWidth = 1;
    for (var r = 0; r < 22; r++) {
      var ry = HOR + 6 + Math.pow(r / 22, 1.5) * (H - HOR) * 0.9;
      var rl = 30 + ((r * 53) % 150), rx = ((r * 197) % Math.max(W, 1));
      g.strokeStyle = "rgba(240,226,198," + (0.08 + (r % 5) * 0.03) + ")";
      g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx + rl, ry); g.stroke();
    }
    for (var q = 0; q < 11; q++) {
      var qy = HOR + 4 + q * (H - HOR) / 13;
      var qw = solR * (1.0 + q * 0.26) * (0.5 + ((q * 37) % 60) / 100);
      var qx = solX - qw / 2 + Math.sin(q * 2.1) * 11;
      g.strokeStyle = "rgba(242,224,192," + (0.24 - q * 0.016) + ")"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(qx, qy); g.lineTo(qx + qw, qy); g.stroke();
    }

    var vin = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.42, W / 2, H / 2, Math.max(W, H) * 0.75);
    vin.addColorStop(0, "rgba(59,42,28,0)"); vin.addColorStop(1, "rgba(59,42,28,.13)");
    g.fillStyle = vin; g.fillRect(0, 0, W, H);

    var gn = 160, gc = document.createElement("canvas");
    gc.width = gc.height = gn;
    var gg = gc.getContext("2d"), img = gg.createImageData(gn, gn);
    for (var i = 0; i < img.data.length; i += 4) {
      var v = (Math.random() * 255) | 0;
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 18;
    }
    gg.putImageData(img, 0, 0);
    g.save(); g.globalAlpha = 0.5; g.fillStyle = g.createPattern(gc, "repeat");
    g.fillRect(0, 0, W, H); g.restore();
  }

  function novoPeixe(i, n, forcarBorda) {
    var faixa = ZY1 - ZY0;
    var prof = (i + 0.35 + Math.random() * 0.5) / n;
    var y0 = ZY0 + 8 + prof * Math.max(20, faixa - 20);
    var prox = clamp((y0 - ZY0) / Math.max(1, faixa), 0, 1);
    var dir = Math.random() < 0.5 ? -1 : 1;
    var livres = PALAVRAS.filter(function (p) {
      for (var k = 0; k < peixes.length; k++) if (peixes[k].sp.palavra === p) return false;
      return true;
    });
    var palavra = (livres.length ? livres : PALAVRAS)[(Math.random() * (livres.length || PALAVRAS.length)) | 0];
    return {
      sp: sprites[palavra],
      x: forcarBorda ? (dir > 0 ? -80 : W + 80) : ((i + Math.random()) / n) * W,
      y0: y0, yb: y0, dir: dir,
      vel: dir * (10 + Math.random() * 16) * (0.55 + prox * 0.6),
      esc: 0.62 + prox * 0.62, alfa: 0.30 + prox * 0.26,
      amp: 2 + prox * 3.5, fNado: 0.9 + Math.random() * 0.9,
      fase: Math.random() * TAU, fx: 0, fy: 0, calmo: false
    };
  }

  function criarPeixes() {
    peixes = [];
    nAlvo = Math.round(PROPS.nadadores != null ? PROPS.nadadores : (MOVEL ? 12 : 15));
    for (var i = 0; i < nAlvo; i++) peixes.push(novoPeixe(i, nAlvo, false));
  }

  function passoPeixes(dt, t) {
    for (var i = 0; i < peixes.length; i++) {
      var p = peixes[i];
      if (!p.calmo && ponteiro.dentro) {
        var dx = p.x - ponteiro.x, dy = p.yb - ponteiro.y, d2 = dx * dx + dy * dy;
        if (d2 < RAIO_FUGA * RAIO_FUGA && d2 > 0.01) {
          var d = Math.sqrt(d2), f = 1 - d / RAIO_FUGA, imp = f * f * 340 * dt;
          p.fx += (dx / d) * imp; p.fy += (dy / d) * imp;
        }
      }
      var fm = Math.hypot(p.fx, p.fy);
      if (fm > 190) { p.fx *= 190 / fm; p.fy *= 190 / fm; }
      var dec = Math.exp(-2.1 * dt); p.fx *= dec; p.fy *= dec;

      if (!p.calmo) {
        for (var a = 0; a < aneis.length; a++) {
          var an = aneis[a];
          var ax = p.x - an.x, ay = p.yb - an.y;
          var ad = Math.hypot(ax, ay) || 0.0001, banda = Math.abs(ad - an.r);
          if (banda < 46) {
            var fo = (1 - banda / 46) * an.forca * dt;
            p.fx += (ax / ad) * fo; p.fy += (ay / ad) * fo;
          }
        }
      }

      p.x += (p.vel * (p.calmo ? 0.35 : 1) + p.fx) * dt;
      p.yb += p.fy * dt;
      p.yb += (p.y0 - p.yb) * Math.min(1, 0.7 * dt);
      var margem = p.sp.w * p.esc + 30;
      if (p === ave.alvo) {
        if (p.x < margem) { p.x = margem; p.dir = 1; p.vel = Math.abs(p.vel); }
        else if (p.x > W - margem) { p.x = W - margem; p.dir = -1; p.vel = -Math.abs(p.vel); }
      } else if (p.x < -margem) p.x = W + margem;
      else if (p.x > W + margem) p.x = -margem;
      p.yb = clamp(p.yb, ZY0, ZY1);
    }
  }

  function desenharPeixes(t) {
    var FAT = 5;
    for (var i = 0; i < peixes.length; i++) {
      var p = peixes[i], sp = p.sp;
      var y = p.yb + Math.sin(t * 0.001 * p.fNado + p.fase) * p.amp;
      var w = sp.w * p.esc, h = sp.h * p.esc;
      var real = p.alfa + (sobre === p ? 0.30 : 0) + (p === ave.alvo ? 0.22 : 0);
      ctx.save();
      ctx.translate(p.x, y);
      ctx.rotate(Math.sin(t * 0.0008 * p.fNado + p.fase * 1.7) * 0.05 * p.dir);
      ctx.globalAlpha = Math.min(1, real);
      for (var f = 0; f < FAT; f++) {
        var sy = (f / FAT) * sp.c.height, sh = sp.c.height / FAT;
        var ond = Math.sin(t * 0.0021 + p.fase + f * 0.95) * (1.1 + p.esc);
        ctx.drawImage(sp.c, 0, sy, sp.c.width, sh, -w / 2 + ond, -h / 2 + (f / FAT) * h, w, h / FAT);
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  var ASA_FECHADA = [{x:0.18,y:0.02},{x:-0.02,y:-0.10},{x:-0.30,y:-0.08},{x:-0.58,y:0.08},
                     {x:-0.78,y:0.28},{x:-0.48,y:0.38},{x:-0.14,y:0.36},{x:0.12,y:0.24}];
  var ASA_ABERTA  = [{x:0.30,y:-0.10},{x:0.10,y:-0.58},{x:-0.30,y:-1.12},{x:-0.88,y:-1.54},
                     {x:-1.56,y:-1.70},{x:-1.32,y:-1.30},{x:-0.74,y:-0.78},{x:-0.16,y:-0.14}];

  function corpoPts(s, t, infla) {
    var pts = [], n = 18;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU;
      var m = 1 + 0.12 * Math.cos(a - 0.55) + 0.05 * Math.sin(a) - 0.055 * Math.cos(a - 3.35) - 0.03 * Math.cos(a * 3);
      m += infla * 0.012 * Math.sin(t * 0.0013 + i * 0.7);
      var rx = 0.745 * s * m, ry = 0.495 * s * m;
      pts.push({ x: Math.cos(a) * rx, y: Math.sin(a) * ry });
    }
    var ct = Math.cos(-0.11), st = Math.sin(-0.11);
    for (i = 0; i < n; i++) {
      var px = pts[i].x, py = pts[i].y;
      pts[i] = { x: px * ct - py * st - 0.02 * s, y: px * st + py * ct - 1.78 * s };
    }
    return pts;
  }

  function asa(g, s, spread, flap, tom, sombra) {
    var raiz = { x: 0.16 * s, y: -1.90 * s };
    var ang = flap * (0.55 + 0.35 * spread) * spread;
    var ca = Math.cos(ang), sa = Math.sin(ang);
    function T(x, y) { return { x: raiz.x + x * s * ca - y * s * sa, y: raiz.y + x * s * sa + y * s * ca }; }
    var pts = [];
    for (var i = 0; i < ASA_FECHADA.length; i++) {

        ave.presa.dx = -Math.cos(ave.ang) * 0.55 * s * q * ave.virado;
        ave.presa.dy = -Math.sin(ave.ang) * 0.55 * s * q;
        ave.presa.rot = q * 0.7; ave.presa.esc = 1 - 0.55 * q; ave.presa.alfa = 0.96 * (1 - q * q);
        if (q >= 1) {
          pescadas += 1; ultima = ave.presa.palavra; readout();
          ave.presa = null; ave.bulge = 1; proxNascer = t + 5200;
        }
      } else {
        ave.bulge -= dt * 1.1;
        if (ave.bulge < -0.15) { ave.bulge = -1; trocar("parado"); }
      }
    }

    var k = (e === "bote") ? 17 : (e === "engolindo" ? 9 : 5.5);
    ave.cab.x = mola(ave.cab.x, ave.cabA.x, k, dt);
    ave.cab.y = mola(ave.cab.y, ave.cabA.y, k, dt);
    var da = ave.angA - ave.ang;
    while (da > Math.PI) da -= TAU; while (da < -Math.PI) da += TAU;
    ave.ang += da * Math.min(1, k * dt);
    if (e !== "indo" && e !== "voando" && e !== "decolando") ave.s = mola(ave.s, escalaPorY(ave.y), 4, dt);
  }

  function desenhar(t, dt) {
    ctx.drawImage(fundo, 0, 0, W, H);
    desenharPeixes(t);
    desenharAneis(dt);
    desenharAve(ctx, t);
    desenharGotas(dt);

    if (ponteiro.dentro && !REDUZ) {
      ctx.save(); ctx.translate(ponteiro.x, ponteiro.y);
      if (sobre) {
        ctx.strokeStyle = "#A64A2A"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, TAU); ctx.stroke();
        ctx.strokeStyle = "rgba(242,234,217,.9)";
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke();
      } else {
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = "#A64A2A"; ctx.fillRect(-2.75, -2.75, 5.5, 5.5);
        ctx.strokeStyle = "rgba(242,234,217,.95)"; ctx.lineWidth = 1;
        ctx.strokeRect(-2.75, -2.75, 5.5, 5.5);
      }
      ctx.restore();
    }
  }

  function quadro(t) {
    var dt = ultimo ? Math.min(0.05, (t - ultimo) / 1000) : 0.016;
    ultimo = t;
    sobre = ponteiro.dentro ? peixeEm(ponteiro.x, ponteiro.y) : null;
    passoPeixes(dt, t);
    passoAve(dt, t);
    if (peixes.length < nAlvo && t > proxNascer) {
      peixes.push(novoPeixe((Math.random() * nAlvo) | 0, nAlvo, true));
      proxNascer = t + 9000;
    }
    desenhar(t, dt);
    raf = requestAnimationFrame(quadro);
  }

  function peixeEm(x, y) {
    var melhor = null, md = 70;
    for (var i = 0; i < peixes.length; i++) {
      var p = peixes[i];
      if (p.x > CARD.l && p.x < CARD.r && p.yb > CARD.t && p.yb < CARD.b) continue;
      var w = p.sp.w * p.esc / 2 + 12, h = p.sp.h * p.esc / 2 + 8;
      var dx = Math.max(Math.abs(x - p.x) - w, 0), dy = Math.max(Math.abs(y - p.yb) - h, 0);
      var d = Math.hypot(dx, dy);
      if (d < md) { md = d; melhor = p; }
    }
    return melhor;
  }

  function medir() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    MOVEL = W < 760;
    var hp = PROPS.horizonte != null ? PROPS.horizonte : (MOVEL ? 0.24 : 0.34);
    HOR = Math.round(H * hp);
    ZY0 = HOR + 30; ZY1 = H - 22;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    if (document.getElementById("card")) posicionarCartao();
    ave.y = clamp(ave.y || (ZY0 + (ZY1 - ZY0) * 0.55), ZY0, ZY1);
    ave.x = clamp(ave.x || W * 0.22, W * 0.04, W * 0.96);
    if (!MOVEL && ave.x > CARD.l && ave.x < CARD.r) ave.x = CARD.l;
    ave.s = escalaPorY(ave.y);
    criarSprites(); pintarFundo(); criarPeixes();
    aneis = []; gotas = []; ave.alvo = null; ave.presa = null;
    if (ave.estado !== "parado") trocar("parado");
  }

  function posicionarCartao() {
    var el = document.getElementById("card"); if (!el) return;
    el.style.transform = "translate(-50%,-50%)";
    var r = el.getBoundingClientRect();
    var cw = r.width > 60 ? r.width : 396, ch = r.height > 60 ? r.height : 470;
    var hp = PROPS.horizonte != null ? PROPS.horizonte : (MOVEL ? 0.24 : 0.34);
    var k, cy;
    if (MOVEL) {
      var reserva = Math.max(104, H * 0.19);
      HOR = Math.round(Math.min(H * hp, Math.max(H * 0.14, H - ch - reserva - 26)));
      k = clamp((H - HOR - reserva - 22) / ch, 0.50, 1);
      cy = HOR + 14 + ch * k / 2;
    } else {
      HOR = Math.round(Math.min(H * hp, Math.max(H * 0.20, H - ch - 44)));
      k = clamp((H - HOR - 40) / ch, 0.55, 1);
      var lo = HOR + ch * k / 2 + 16, hi = H - ch * k / 2 - 16;
      cy = lo > hi ? H * 0.5 : clamp(HOR + (H - HOR) * 0.54, lo, hi);
    }
    var cx = W * 0.5;
    el.style.right = "auto";
    el.style.left = Math.round(cx) + "px";
    el.style.top = Math.round(cy) + "px";
    el.style.transform = "translate(-50%,-50%) scale(" + k.toFixed(3) + ")";
    CARD.l = cx - cw * k / 2 - 22; CARD.r = cx + cw * k / 2 + 22;
    CARD.t = cy - ch * k / 2 - 12; CARD.b = cy + ch * k / 2 + 12;
    ZY1 = H - 22;
    ZY0 = MOVEL ? Math.max(HOR + 20, CARD.b + 10) : HOR + 30;
    if (ZY1 - ZY0 < 56) ZY0 = Math.max(HOR + 16, ZY1 - 56);
  }

  function iniciar() {
    cancelAnimationFrame(raf); ultimo = 0;
    medir();
    if (REDUZ) { cv.style.cursor = "default"; sumirDica(); desenhar(0, 0.016); }
    else raf = requestAnimationFrame(quadro);
  }

  function sumirDica() {
    var d = document.getElementById("dica");
    if (d && d.style.opacity !== "0") d.style.opacity = "0";
  }

  var onMove = function (e) {
    if (REDUZ) return;
    ponteiro.x = e.clientX; ponteiro.y = e.clientY; ponteiro.dentro = true;
  };
  var onDown = function (e) {
    if (REDUZ) return;
    ponteiro.x = e.clientX; ponteiro.y = e.clientY; ponteiro.dentro = true;
    if (e.target !== cv) return;
    sumirDica();
    var p = peixeEm(e.clientX, e.clientY);
    if (p && !ave.presa && ave.estado !== "bote" && ave.estado !== "erguendo" &&
        ave.estado !== "mostrando" && ave.estado !== "engolindo") {
      if (ave.alvo && ave.alvo !== p) ave.alvo.calmo = false;
      ave.alvo = p; ave.espera = 0; ave.caca = 0; p.calmo = true;
      if (ave.estado === "parado") trocar("indo");
      aneis.push({ x: e.clientX, y: e.clientY, r: 6, rMax: Math.max(W, H) * 0.12, forca: 60, vel: 200 });
    } else if (e.clientY > HOR) {
      aneis.push({ x: e.clientX, y: e.clientY, r: 8, rMax: Math.max(W, H) * 0.28, forca: 300 });
      if (aneis.length > 8) aneis.shift();
    }
  };
  var onLeave = function () { ponteiro.dentro = false; };
  var rzT = 0;
  var onResize = function () { clearTimeout(rzT); rzT = setTimeout(iniciar, 160); };

  window.addEventListener("pointermove", onMove, { passive: true });
  window.addEventListener("pointerdown", onDown, { passive: true });
  document.addEventListener("mouseleave", onLeave);
  window.addEventListener("blur", onLeave);
  window.addEventListener("resize", onResize);

  iniciar();
  setTimeout(posicionarCartao, 350);
})();
</script>
</body>
</html>
