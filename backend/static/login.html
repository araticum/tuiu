<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuiú · Entrar</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --acento:#4da3ff; --erro:#ff6b6b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .cartao { background:var(--card); border:1px solid var(--linha); border-radius:12px;
            padding:28px 30px; width:100%; max-width:380px; }
  h1 { font-size:20px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:22px; }
  label { display:block; font-size:12px; color:var(--dim); margin:14px 0 5px; }
  input { width:100%; background:#0e1622; border:1px solid var(--linha); border-radius:7px;
          padding:10px 12px; color:var(--tx); font-size:14px; }
  input:focus { outline:none; border-color:var(--acento); }
  button { width:100%; margin-top:20px; background:#17415f; color:#cfe6ff; border:1px solid #22597f;
           border-radius:7px; padding:11px; font-size:14px; cursor:pointer; }
  button:hover { background:#1b4f73; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .erro { color:var(--erro); font-size:12.5px; margin-top:14px; min-height:18px; }
  .nota { color:var(--dim); font-size:11.5px; margin-top:18px; border-top:1px solid var(--linha);
          padding-top:12px; }
  code { font-family:ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<div class="cartao">
  <h1>Tuiú</h1>
  <div class="sub">Console de operação · Transferegov</div>

  <form id="f" onsubmit="entrar(event)">
    <label for="login">Usuário</label>
    <input id="login" name="login" autocomplete="username" autofocus required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Entrar</button>
  </form>
  <div class="erro" id="erro"></div>
  <div class="nota" id="nota"></div>
</div>

<script>
// se ainda não há usuário, dizer o comando em vez de deixar a pessoa tentando
fetch("/api/sessao").then(r => r.json()).then(d => {
  if (d.autenticado) { location.href = "/"; return; }
  if (!d.ha_usuario) {
    document.getElementById("nota").innerHTML =
      "Nenhum usuário cadastrado ainda. No host:<br><code>python ferramentas/usuario.py --criar &lt;login&gt; --nome \"Seu Nome\"</code>";
  }
});

async function entrar(ev) {
  ev.preventDefault();
  const b = document.getElementById("b"), erro = document.getElementById("erro");
  b.disabled = true; erro.textContent = "";
  try {
    const r = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login: f.login.value, senha: f.senha.value }),
    });
    if (r.ok) { location.href = "/"; return; }
    const d = await r.json().catch(() => ({}));
    erro.textContent = d.detail || "não foi possível entrar";
  } catch (e) {
    erro.textContent = "falha de rede";
  } finally {
    b.disabled = false;
    document.getElementById("senha").value = "";
  }
}
</script>
</body>
</html>
