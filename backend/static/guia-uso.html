<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuiú · Uso do guia</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --ok:#2fbf71; --at:#e8b93c; --ruim:#e35d5d; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:26px; }
  a { color:var(--acento); text-decoration:none; }
  header { margin-bottom:6px } h1{ font-size:22px } h1 small{ color:var(--dim); font-weight:400; font-size:13px; margin-left:8px }
  .porque{ color:var(--dim); font-size:12.5px; max-width:820px; margin-bottom:16px }
  .kpis{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px }
  .kpi{ background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:13px 18px; min-width:150px }
  .kpi b{ font-size:25px; display:block; line-height:1.1 } .kpi span{ color:var(--dim); font-size:12px }
  .kpi.ok b{ color:var(--ok) } .kpi.custo b{ color:var(--at) }
  .grid{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start }
  @media(max-width:900px){ .grid{ grid-template-columns:1fr } }
  .sec{ font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); margin:4px 0 9px }
  .box{ background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:6px 4px }
  .li{ display:flex; gap:10px; align-items:baseline; padding:8px 13px; border-bottom:1px solid var(--linha) }
  .li:last-child{ border:0 } .li .n{ flex:0 0 34px; text-align:right; font-variant-numeric:tabular-nums; color:var(--acento); font-weight:600 }
  .li .q{ flex:1; font-size:13px } .li .u{ color:var(--dim); font-size:12px }
  .tag{ font-size:10px; text-transform:uppercase; letter-spacing:.4px; color:var(--dim); border:1px solid var(--linha); border-radius:999px; padding:1px 7px }
  .vazio{ color:var(--dim); padding:16px 13px }
</style>
</head>
<body>
<header><h1>Uso do guia <small>o que perguntam · quanto custa</small></h1></header>
<div class="porque">Toda pergunta ao guia fica registrada. Aqui: o <b>volume</b>, <b>o que os
  operadores e clientes mais perguntam</b> (a dor que vira próxima feature) e o <b>custo</b> do mês
  em tokens — já com o desconto do cache.</div>

<div class="kpis" id="kpis"><div class="vazio">carregando…</div></div>

<div class="grid">
  <div>
    <div class="sec">O que mais perguntam</div>
    <div class="box" id="top"></div>
  </div>
  <div>
    <div class="sec">Por quem pergunta</div>
    <div class="box" id="usuarios"></div>
  </div>
</div>

<script>
fetch("/api/guia/metricas").then(r=>{
  if(r.status===403){ document.body.innerHTML='<p style="color:#8ba3bf;padding:24px">Só operador vê o uso do guia.</p>'; return null; }
  return r.json();
}).then(d=>{
  if(!d) return;
  if(!d.disponivel){ document.getElementById("kpis").innerHTML=`<div class="vazio">indisponível: ${d.erro||"—"}</div>`; return; }
  const m = d.mes||{};
  document.getElementById("kpis").innerHTML = [
    ["", d.total||0, "perguntas (total)"],
    ["ok", d.semana||0, "últimos 7 dias"],
    ["", d.hoje||0, "hoje"],
    ["custo", "US$ "+(m.custo_usd||0).toFixed(2), "custo do mês"],
    ["", (m.cache_pct||0)+"%", "tokens do cache"],
    [d.sem_resposta?"":"", d.sem_resposta||0, "sem resposta"],
  ].map(([cls,n,l])=>`<div class="kpi ${cls}"><b>${n}</b><span>${l}</span></div>`).join("");

  const top = d.top||[];
  document.getElementById("top").innerHTML = top.length
    ? top.map(t=>`<div class="li"><span class="n">${t.n}×</span><span class="q">${(t.pergunta||"").replace(/</g,"&lt;")}</span></div>`).join("")
    : `<div class="vazio">Nenhuma pergunta ainda. Assim que o guia for usado, aparece aqui.</div>`;

  const us = d.por_usuario||[];
  document.getElementById("usuarios").innerHTML = us.length
    ? us.map(u=>`<div class="li"><span class="n">${u.n}</span><span class="q">${(u.usuario||"—").replace(/</g,"&lt;")}</span><span class="tag">${u.papel||"?"}</span></div>`).join("")
    : `<div class="vazio">—</div>`;
});
</script>
<script src="/nav.js" defer></script>
</body>
</html>
