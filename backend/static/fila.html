<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/tema.js"></script>
<script src="/br.js"></script>
<link rel="stylesheet" href="/tuiu-cartorio.css">
<title>Tuiú · Fila do operador</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --ok:#2fbf71; --at:#e8b93c; --ruim:#e35d5d; --acao:#ff7a59; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:24px; }
  a { color:var(--acento); text-decoration:none; }
  header { display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  h1 { font-size:22px; } h1 small{ color:var(--dim); font-weight:400; font-size:13px; margin-left:8px }
  .kpis{ display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 16px }
  .kpi{ background:var(--card); border:1px solid var(--linha); border-radius:11px; padding:9px 15px }
  .kpi b{ font-size:21px; display:block; line-height:1.15 } .kpi span{ color:var(--dim); font-size:11.5px }
  .kpi.acao b{color:var(--acao)} .kpi.vencido b{color:var(--ruim)} .kpi.atencao b{color:var(--at)}
  .filtros{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center }
  select,button{ background:var(--card); color:var(--tx); border:1px solid var(--linha);
                 border-radius:8px; padding:5px 10px; font-size:12.5px; cursor:pointer }
  button:hover{ border-color:var(--acento) }
  .item{ background:var(--card); border:1px solid var(--linha); border-radius:10px;
         padding:10px 13px; margin-bottom:8px; display:flex; gap:11px; align-items:flex-start }
  .dot{ flex:0 0 9px; width:9px; height:9px; border-radius:50%; margin-top:6px }
  .acao_imediata{background:var(--acao)} .vencido{background:var(--ruim)} .atencao{background:var(--at)} .ok{background:var(--ok)}
  .quando{ flex:0 0 92px; font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--dim); margin-top:1px }
  .quando b{ color:var(--tx); display:block; font-size:12.5px }
  .corpo{ flex:1 }
  .cli{ color:var(--acento); font-weight:600 }
  .passo{ color:var(--tx); font-size:12.5px; margin-top:3px }
  .passo::before{ content:"▸ "; color:var(--ok) }
  .base{ color:var(--dim); font-size:11.5px; margin-top:2px }
  .acoes{ flex:0 0 auto; display:flex; gap:5px; align-items:flex-start }
  .acoes button{ padding:3px 8px; font-size:11.5px }
  .vazio{ color:var(--dim); padding:20px 0 }
  .resolvido{ opacity:.45 }
  .grp{ margin:16px 0 7px; font-size:13px; font-weight:600; border-bottom:1px solid var(--linha); padding-bottom:4px }
  .grp a{ color:var(--acento) } .grp span{ color:var(--dim); font-weight:400; font-size:11.5px; margin-left:6px }
</style>
</head>
<body>
<header>
  <h1>Fila do operador <small>o que fazer hoje, por cliente</small></h1>
</header>

<div class="kpis" id="kpis"></div>
<div class="filtros">
  <select id="cliente"><option value="">todos os clientes</option></select>
  <label><input type="checkbox" id="soClientes" checked> só carteira de clientes</label>
  <label><input type="checkbox" id="abertos" checked> só pendentes</label>
  <label><input type="checkbox" id="agrupar"> agrupar por cliente</label>
</div>
<div id="fila">carregando…</div>

<script>
const dbr = s => s ? s.split("-").reverse().join("/") : null;
let dados = null;

function carregar(){
  const c = document.getElementById("cliente").value;
  const so = document.getElementById("soClientes").checked;
  const ab = document.getElementById("abertos").checked;
  fetch(`/api/fila?so_clientes=${so}&abertos=${ab}${c?`&cliente=${c}`:""}`)
    .then(r=>r.json()).then(d=>{ dados=d; render(); });
}

function render(){
  const d = dados;
  if(!d.disponivel){ document.getElementById("fila").innerHTML=`<div class="vazio">indisponível: ${d.erro}</div>`; return; }
  const u = d.por_urgencia||{};
  document.getElementById("kpis").innerHTML = [
    ["acao", u.acao_imediata||0, "ação imediata"],
    ["vencido", u.vencido||0, "vencidos"],
    ["atencao", u.atencao||0, "próximos 90d"],
    ["", d.total||0, "itens na fila"],
  ].map(([cls,n,l])=>`<div class="kpi ${cls}"><b>${n}</b><span>${l}</span></div>`).join("");

  const sel=document.getElementById("cliente");
  if(sel.options.length<=1){
    Object.keys(d.por_cliente||{}).forEach(n=>{
      const it=(d.itens||[]).find(i=>i.cliente_nome===n);
      if(it) sel.insertAdjacentHTML("beforeend", `<option value="${it.cliente}">${n}</option>`);
    });
  }

  const el=document.getElementById("fila");
  const its=d.itens||[];
  if(!its.length){ el.innerHTML=`<div class="vazio">Nada pendente. 🎉</div>`; return; }
  if(document.getElementById("agrupar").checked){
    const grupos={};
    its.forEach(i=>{ (grupos[i.cliente_nome]=grupos[i.cliente_nome]||{doc:i.cliente,itens:[]}).itens.push(i); });
    el.innerHTML = Object.entries(grupos).map(([nome,g])=>
      `<div class="grp"><a href="/cliente.html?doc=${g.doc}">${nome}</a><span>${qtd(g.itens.length, "item", "itens")}</span></div>`
      + g.itens.map(itemHtml).join("")).join("");
  } else {
    el.innerHTML = its.map(itemHtml).join("");
  }
}

function itemHtml(i){
  const quando = i.prazo
    ? `<b>${dbr(i.prazo)}</b>${i.dias<0?`${-i.dias}d atrás`:`em ${i.dias}d`}`
    : `<b>AGORA</b>sem prazo`;
  return `<div class="item ${i.status==='resolvido'?'resolvido':''}">
    <span class="dot ${i.urgencia}"></span>
    <span class="quando">${quando}</span>
    <span class="corpo">
      <a class="cli" href="/cliente.html?doc=${i.cliente}">${i.cliente_nome}</a> — ${i.descricao}
      <div class="passo">${i.proximo_passo}</div>
      <div class="base">${i.base_legal||""} ${i.referencia?`· ${i.referencia}`:""} ${i.status!=='aberto'?`· <b>${i.status}</b>`:""}</div>
    </span>
    <span class="acoes">
      <button onclick="triar('${i.chave}','em_andamento')">tratando</button>
      <button onclick="triar('${i.chave}','resolvido')">resolvido</button>
    </span></div>`;
}

function triar(chave, status){
  fetch("/api/fila/triar", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({chave, status, operador:"araticum"})})
    .then(r=>r.json()).then(()=>carregar());
}

["cliente","soClientes","abertos"].forEach(id=>document.getElementById(id).onchange=carregar);
document.getElementById("agrupar").onchange=render;
carregar();
</script>
<script src="/nav.js" defer></script>
</body>
</html>
