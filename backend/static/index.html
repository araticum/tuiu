<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/tema.js"></script>
<script src="/br.js"></script>
<link rel="stylesheet" href="/tuiu-cartorio.css">
<title>Tuiú · Cockpit</title>
<style>
  :root { --bg:#0b1017; --card:#121a26; --card2:#0f1621; --linha:#1e2a3a; --tx:#dbe6f4; --dim:#8ba3bf;
          --ok:#2fbf71; --at:#e8b93c; --ruim:#e35d5d; --acao:#ff7a59; --acento:#4da3ff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:14px/1.5 system-ui, Segoe UI, sans-serif; padding:26px; }
  a { color:var(--acento); text-decoration:none; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  h1 { font-size:23px; letter-spacing:.3px; }
  h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  .badge { background:var(--card); border:1px solid var(--linha); border-radius:999px; padding:4px 12px; font-size:12px; color:var(--dim); }
  .kpis { display:flex; gap:12px; flex-wrap:wrap; margin:6px 0 22px; }
  .kpi { background:var(--card); border:1px solid var(--linha); border-radius:12px; padding:12px 18px; min-width:140px; }
  .kpi b { font-size:26px; display:block; line-height:1.1; }
  .kpi span { color:var(--dim); font-size:12px; }
  .kpi.acao b{color:var(--acao)} .kpi.vencido b{color:var(--ruim)} .kpi.atencao b{color:var(--at)} .kpi.ev b{color:var(--acento)}
  .col2 { display:grid; grid-template-columns: 1.15fr 1fr; gap:20px; align-items:start; }
  @media (max-width:1000px){ .col2{grid-template-columns:1fr} }
  .sec { font-size:12px; letter-spacing:.8px; text-transform:uppercase; color:var(--dim); margin:6px 0 10px; }
  .prio { background:var(--card); border:1px solid var(--linha); border-radius:10px; padding:9px 13px; margin-bottom:8px; display:flex; gap:11px; }
  .dot { flex:0 0 9px; width:9px; height:9px; border-radius:50%; margin-top:6px; }
  .acao_imediata{background:var(--acao)} .vencido{background:var(--ruim)} .atencao{background:var(--at)} .ok{background:var(--ok)}
  .prio .quando { flex:0 0 96px; font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--dim); margin-top:1px; }
  .prio .quando b{ color:var(--tx); display:block; font-size:12.5px }
  .prio .d b.ente{ color:var(--acento); font-weight:600 }
  .prio .base{ display:block; color:var(--dim); font-size:11.5px; margin-top:2px }
  .entes-lista{ display:flex; flex-direction:column; gap:6px; }
  .er{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--linha);
       border-left:3px solid var(--linha); border-radius:9px; padding:8px 12px; }
  .er.acao{ border-left-color:var(--acao) } .er.vencido{ border-left-color:var(--ruim) }
  .er.atencao{ border-left-color:var(--at) } .er.ok{ border-left-color:#25412f }
  .er .nome{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .er .nome a{ color:var(--tx); font-weight:600; font-size:13.5px } .er .nome a:hover{ color:var(--acento) }
  .er .nome .loc{ color:var(--dim); font-size:11.5px; font-weight:400 }
  .er .marks{ display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; flex:0 0 auto }
  .tagN{ border-radius:999px; padding:1px 8px; font-size:11px; border:1px solid var(--linha); color:var(--dim); white-space:nowrap }
  .tagN.acao{ border-color:#5a3a2b; color:var(--acao) } .tagN.vencido{ border-color:#5a2b2b; color:var(--ruim) }
  .tagN.at{ border-color:#5a4a1a; color:var(--at) }
  .toggle-dia{ margin-top:9px; color:var(--dim); font-size:12px; cursor:pointer; user-select:none }
  .toggle-dia:hover{ color:var(--tx) }
  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { border:1px solid var(--linha); border-radius:999px; padding:2px 9px; font-size:12px; color:var(--dim); }
  .pill b{ color:var(--tx) } .pill.ruim{ border-color:#5a2b2b; color:var(--ruim) } .pill.ruim b{color:var(--ruim)}
  .pill.acao{ border-color:#5a3a2b; color:var(--acao) } .pill.acao b{color:var(--acao)}
  .pill.ok{ color:var(--ok) }
  .andamento{ margin-top:9px; border-top:1px solid var(--linha); padding-top:8px; }
  .andamento .ev{ font-size:12.5px; color:var(--dim); padding:1px 0; }
  .andamento .ev b{ color:var(--tx) }
  .vazio{ color:var(--dim); font-size:12.5px; }
  footer{ margin-top:22px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Cockpit <small>transferências da União</small></h1>
  <span class="badge" id="snap">carregando…</span>
  <span class="badge" id="conf" title="Conferência de integridade contra a g2 oficial ao vivo"></span>
</header>

<div class="kpis" id="kpis"></div>

<div class="col2">
  <div>
    <div class="sec">Prioridades — agir agora</div>
    <div id="prioridades"><div class="vazio">carregando…</div></div>
  </div>
  <div>
    <div class="sec">Entes monitorados</div>
    <div id="entes"></div>
  </div>
</div>

<footer>Dados públicos oficiais (Transferegov g2 + CSVs detru + CAUC), D-1. Prazos, andamento e notificações derivados por regra normativa versionada.</footer>

<script>
const brl = v => (v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const dbr = s => s ? s.split("-").reverse().join("/") : "—";
const hoje = new Date(); hoje.setHours(0,0,0,0);

fetch("/api/verificacao").then(r=>r.json()).then(v=>{
  const el = document.getElementById("conf");
  if(!v.disponivel){ el.textContent = ""; return; }
  const r = v.resumo||{};
  const ok = (r.divergem||0)===0 && v.snapshot_fresco;
  el.textContent = ok ? `✓ confere com a g2 (${r.conferem})` : `⚠ ${qtd(r.divergem, "divergência", "divergências")}`;
  el.style.color = ok ? "var(--ok)" : "var(--at)";
}).catch(()=>{});

fetch("/api/cockpit").then(r=>r.json()).then(c=>{
  document.getElementById("snap").textContent = c.snapshot ? `dados de ${dbr(c.snapshot)} (D-1)` : "sem dados";
  const t = c.totais||{};
  document.getElementById("kpis").innerHTML = [
    ["acao", t.acao_imediata||0, "ação imediata"],
    ["vencido", t.vencido||0, "prazos vencidos"],
    ["atencao", t.atencao||0, "vencem em 90d"],
    ["ev", t.eventos||0, "eventos de andamento"],
  ].map(([cls,n,lbl])=>`<div class="kpi ${cls}"><b>${n}</b><span>${lbl}</span></div>`).join("");

  const pe = document.getElementById("prioridades");
  if(!(c.prioridades||[]).length){ pe.innerHTML = `<div class="vazio">Nada em ação imediata ou vencido. 🎉</div>`; }
  else pe.innerHTML = c.prioridades.map(m=>{
    const dias = m.data_limite ? Math.round((new Date(m.data_limite)-hoje)/86400000) : null;
    const quando = m.data_limite ? `<b>${dbr(m.data_limite)}</b>${dias<0?`${-dias}d atrás`:`${dias}d`}` : `<b>AGORA</b>`;
    return `<div class="prio"><span class="dot ${m.farol}"></span>
      <span class="quando">${quando}</span>
      <span class="d"><a class="ente" href="/cliente.html?doc=${m.cnpj}">${m.ente}</a> — ${m.descricao}
        <span class="base">${m.base_legal}</span></span></div>`;
  }).join("");

  // Ordena por urgência (agir agora › vencido › 90d) e recolhe quem está em dia
  // — em vez de 50 cards num rolo. Só o CONVENENTE conta como "agir agora":
  // o que espera o órgão não infla a carteira (feedback do especialista).
  const entes = (c.entes||[]).map(e=>{
    const mk=e.marcos||{}, s=e.saude||{};
    const acao=(mk.acao_imediata||0)+(s.impedimentos_pix||0);
    const venc=(mk.vencido||0)+(s.prestacoes_vencidas||0);
    const at=mk.atencao||0, score=acao*1000+venc*100+at;
    return {e, acao, venc, at, score, worst: acao?"acao":venc?"vencido":at?"atencao":"ok"};
  }).sort((a,b)=>b.score-a.score);
  const linha = o=>{
    const marks=[];
    if(o.acao) marks.push(`<span class="tagN acao">${o.acao} agir agora</span>`);
    if(o.venc) marks.push(`<span class="tagN vencido">${o.venc} vencido</span>`);
    if(o.at)   marks.push(`<span class="tagN at">${o.at} em 90d</span>`);
    if(!marks.length) marks.push(`<span class="tagN">em dia · ${o.e.saude.instrumentos_ativos||0} ativos</span>`);
    return `<div class="er ${o.worst}"><div class="nome"><a href="/cliente.html?doc=${o.e.cnpj}">${o.e.rotulo}</a>`
      + `<span class="loc"> · ${o.e.municipio||"—"}/${o.e.uf||"—"}</span></div>`
      + `<div class="marks">${marks.join("")}</div></div>`;
  };
  const pend = entes.filter(o=>o.score>0), dia = entes.filter(o=>o.score===0);
  document.getElementById("entes").innerHTML =
    (pend.length ? `<div class="entes-lista">${pend.map(linha).join("")}</div>`
                 : `<div class="vazio">Nenhum ente com pendência sua. 🎉</div>`)
    + (dia.length ? `<div class="toggle-dia" onclick="var n=this.nextElementSibling;var v=n.style.display==='none';n.style.display=v?'flex':'none';this.textContent=(v?'▾ ':'▸ ')+qtd(${dia.length}, 'ente', 'entes')+' em dia'">▸ ${qtd(dia.length, "ente", "entes")} em dia</div>`
       + `<div class="entes-lista" style="display:none;margin-top:6px;opacity:.62">${dia.map(linha).join("")}</div>` : "");
});
</script>
<script src="/nav.js" defer></script>
</body>
</html>
